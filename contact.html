        <h2 class="text-center mb-4">Contact Us</h2>

        <div class="row justify-content-center">

            <div class="col-md-8">
              <!-- icons add -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<a href="http://www.youtube.com/"target="_blank"><i class="bi bi-youtube social"></i></a>

<!--icons end  -->
                <form>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter your full name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mobile Number</label>
                        <input type="tel" class="form-control" placeholder="Enter your mobile number" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subject</label>
                        <input type="text" class="form-control" placeholder="Enter subject">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="5" placeholder="Write your message here..." required></textarea>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-5">
                            Send Message
                        </button>

                        <button type="reset" class="btn btn-secondary px-5 ms-2">
                            Reset
                        </button>
                    </div>

                </form>

            </div>

        </div>
